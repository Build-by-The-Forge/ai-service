[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-service"
version = "1.0.0"
description = "AI engine for CBT + Learning Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.23",
    "asyncpg==0.29.0",
    "python-dotenv==1.0.0",
    "python-jose==3.3.0",
    "passlib[bcrypt]==1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "pytest-asyncio==0.21.1",
    "black==23.12.0",
    "ruff==0.1.8",
    "mypy==1.7.1",
    "pre-commit==4.5.0",
    "types-python-jose==3.5.0.20260408",
    "types-passlib==1.7.7.20260211",
    "types-pyasn1==0.6.0.20260408",
    "types-redis==4.6.0.20241004",
]

[tool.pytest.ini_options]
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
target-version = ["py312"]
line-length = 100
