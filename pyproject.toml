[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-service"
version = "1.0.0"
description = "AI engine for CBT + Learning Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.11.0",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.23",
    "asyncpg==0.29.0",
    "alembic==1.18.5",
    "redis==5.0.0",
    "openai==1.109.1",
    "anyio==4.14.2",
    "httpx==0.27.2",
    "boto3==1.43.108",
    "botocore==1.43.108",
    "PyMuPDF==1.28.0",
    # Windows development keeps 2.6.2 (requirements-ocr.txt explains).
    "paddlepaddle==3.3.1; sys_platform != 'win32'",
    "paddlepaddle==2.6.2; sys_platform == 'win32'",
    "paddleocr==2.7.0",
    "Pillow==13.0.0",
    "opencv-python-headless==4.11.0.86",
    "prometheus-fastapi-instrumentator==8.1.0",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
# Benchmark-only; never in the production image (requirements-ocr-benchmark.txt).
ocr-benchmark = [
    "openvino==2026.3.1",
]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "black==26.10.1",
    "ruff==0.1.8",
    "mypy==1.7.1",
    "pre-commit==4.5.0",
    "types-pyasn1==0.6.0.20260408",
    "types-redis==4.6.0.20241004",
]

[tool.pytest.ini_options]
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
target-version = ["py312"]
line-length = 100
