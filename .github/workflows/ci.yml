name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # The learning-memory gate on real images: only the production stage has
  # the marker, so no unit test can prove a misconfigured image refuses.
  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      # No --target: what a plain build produces must be the production stage.
      - name: Build the default stage
        run: docker build --secret id=github_token,env=GITHUB_TOKEN -t build-ai-default .

      - name: Build the app stage
        run: docker build --secret id=github_token,env=GITHUB_TOKEN --target app -t build-ai-app .

      - name: Check the learning-memory gate
        run: scripts/check_memory_gate_image.sh build-ai-default build-ai-app

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17@sha256:40b404964359299eefdd5f8518facf1886c562848cf4de13b6eaf91cb70c2b87
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Collect from tests/ only: a bare `pytest` also collects the helpers in
      # scripts/run_smoke_test.py, whose parameters are not fixtures. The XML
      # report is the coverage.xml the next step uploads.
      - name: Run tests
        run: |
          pytest tests/ -v -ra --tb=short --junitxml=pytest-junit.xml --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      # A red run explains itself: the failing tests and their error lines go to the job
      # summary, and the full JUnit report is an artifact (read it with a tool, no log scraping).
      - name: Summarise test failures
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          if not os.path.exists("pytest-junit.xml"):
              print("No JUnit report: the tests did not finish (see the run log).")
          else:
              root = ET.parse("pytest-junit.xml").getroot()
              cases = list(root.iter("testcase"))
              bad = [(c, t) for c in cases for t in ("failure", "error") if c.find(t) is not None]
              print("### Tests: %d run, %d failing or erroring" % (len(cases), len(bad)))
              for c, t in bad[:60]:
                  e = c.find(t)
                  lines = [l for l in (e.text or "").splitlines() if l.startswith("E ")][:4]
                  print("- `%s::%s`" % (c.get("classname"), c.get("name")))
                  for l in lines or [(e.get("message") or "")[:200]]:
                      print("  - `%s`" % l[:200].replace("`", "'"))
              if len(bad) > 60:
                  print("... and %d more (see the pytest-junit artifact)" % (len(bad) - 60))
          PY

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-junit
          path: pytest-junit.xml
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml
