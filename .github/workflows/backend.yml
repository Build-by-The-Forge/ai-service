name: AI Service CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black mypy
      - name: Ruff lint
        run: |
          ruff check .
      - name: Black format check
        run: |
          black --check .
      - name: Mypy type check
        run: |
          mypy app

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit
      - name: Pip audit
        run: |
          pip-audit --progress=off
      - name: Bandit scan
        run: |
          bandit -r app -ll

  tests:
    name: Integration and contract tests
    runs-on: ubuntu-latest
    needs:
      - quality
      - security
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: build_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost/build_ai
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Wait for dependent services
        run: |
          python scripts/wait_for_services.py
      - name: Review migrations
        run: |
          python scripts/review_migration.py
      - name: Run migrations
        run: |
          alembic upgrade head
      - name: Integration tests
        run: |
          pytest tests/integration -q -rA --cov=app --cov-report=xml --cov-fail-under=80
      - name: Contract tests
        run: |
          pytest tests/contracts -q -rA
      - name: Upload coverage report
        if: always()
        run: |
          python -m pytest --cov=app --cov-report=xml tests/integration tests/contracts

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build container
        run: |
          docker build .
