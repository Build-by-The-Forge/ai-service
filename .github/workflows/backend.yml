name: AI Service CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ai-service-ci-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v5
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pre-commit
        run: |
          python -m pre_commit run --all-files
      - name: Run explicit quality checks
        run: |
          python -m ruff check .
          python -m black --check .
          python -m mypy app

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v5
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt bandit pip-audit
      - name: Pip audit
        run: |
          python -m pip_audit --progress=off
      - name: Bandit scan
        run: |
          bandit -r app -ll

  tests:
    name: Full test suite
    runs-on: ubuntu-latest
    needs:
      - quality
      - security
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17@sha256:40b404964359299eefdd5f8518facf1886c562848cf4de13b6eaf91cb70c2b87
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: build_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost/build_ai
      REDIS_URL: redis://localhost:6379
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v5
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Wait for dependent services
        run: |
          python scripts/wait_for_services.py
      - name: Review migrations
        run: |
          python scripts/review_migration.py
      - name: Run migrations
        run: |
          alembic upgrade head
      # The 80% floor applies to the whole suite (unit, integration,
      # contract), the scope the coverage figure is meant to describe.
      - name: Run the full test suite
        run: |
          pytest tests -q -rA --cov=app --cov-report=xml --cov-fail-under=80
      - name: Upload coverage report
        if: always()
        run: |
          echo "Coverage report generated"

  storage:
    # The asset fetcher against a real S3-compatible service: SeaweedFS
    # pinned by digest, with identities generated for this run
    # (scripts/seaweedfs_test_storage.sh). The fetcher reads with a
    # read-only identity, as the AI-service does in deployment. The tests
    # are required: missing configuration is a collection error, and any
    # skipped test fails the job.
    name: Object storage gate
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v5
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Start SeaweedFS with generated identities
        run: scripts/seaweedfs_test_storage.sh start "$GITHUB_ENV"
      - name: Asset fetcher against the real service (required, none skipped)
        env:
          OBJECT_STORAGE_TESTS_REQUIRED: '1'
        run: |
          pytest tests/integration/test_asset_fetcher_real_storage.py -q -rA -p no:cacheprovider | tee storage-tests.log
          if grep -qE '(^SKIPPED|[0-9]+ skipped)' storage-tests.log; then
            echo "::error::object-storage tests were skipped; they are required in this job"
            exit 1
          fi
      - name: SeaweedFS logs on failure
        if: failure()
        run: docker logs build-test-seaweedfs 2>&1 | tail -100 || true
      - name: Stop SeaweedFS
        if: always()
        run: scripts/seaweedfs_test_storage.sh stop

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v5
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build container
        # OCR models come from the project's GitHub Release mirror
        # (models/ocr/manifest.json), verified by SHA-256. The job token is a
        # BuildKit secret, never an image layer.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOCKER_BUILDKIT=1 docker build --secret id=github_token,env=GITHUB_TOKEN -t ai-service:ci .
      - name: Real OCR in the image with networking disabled
        run: |
          bash scripts/test_offline_ocr_image.sh ai-service:ci
      # The security job audits the development environment, which has no
      # OCR stack. This audits exactly what the image installs; accepted
      # advisories are listed, with reasons, in
      # security/accepted-image-advisories.txt.
      - name: Audit the packages in the image
        run: |
          pip install pip-audit==2.10.1
          python scripts/audit_image_packages.py ai-service:ci
      # Production runs this exact, tested image (with its verified models),
      # by immutable tag or digest; it never downloads models at startup.
      # Publishing is off unless the repository variable PUBLISH_IMAGES is
      # exactly "true"; it stays unset until release gate R4 is closed
      # (docs/phase2-release-gate-r4.md). Expression comparisons ignore case,
      # so the step checks the exact value again before it logs in.
      - name: Publish the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_IMAGES: ${{ vars.PUBLISH_IMAGES }}
        run: |
          if [ "$PUBLISH_IMAGES" != "true" ]; then
            echo "::error::PUBLISH_IMAGES must be exactly 'true' to publish; nothing was published"
            exit 1
          fi
          image="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):sha-${{ github.sha }}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ai-service:ci "$image"
          docker push "$image"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "Published $image" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Image publication is off
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGES != 'true'
        run: |
          echo "::notice::Image built and tested, not published: PUBLISH_IMAGES is not 'true' (release gate R4)"
          echo "Not published: the repository variable PUBLISH_IMAGES is not 'true' (release gate R4)." >> "$GITHUB_STEP_SUMMARY"
