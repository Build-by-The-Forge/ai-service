name: AI Service CI

on:
  pull_request:

  push:
    branches:
      - main

jobs:

  validate:

    runs-on: ubuntu-latest

    services:

      postgres:

        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: build_ai

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:

        image: redis:8-alpine

        ports:
          - 6379:6379

    env:

      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost/build_ai

      REDIS_URL: redis://localhost:6379

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install

        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Lint

        run: |
          ruff check .

      - name: Type check

        run: |
          pip install mypy
          mypy app

      - name: Review migrations

        run: |
          python scripts/review_migration.py

      - name: Wait for services

        run: |
          python scripts/wait_for_services.py

      - name: Run migrations

        run: |
          alembic upgrade head

      - name: Integration tests

        run: |
          pytest tests/integration -v

      - name: Contract tests

        run: |
          pytest tests/contracts -v

      - name: Build container

        run: |
          docker build .
