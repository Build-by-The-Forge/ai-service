# AI-12 desktop benchmark on a clean GitHub-hosted runner.
#
# Manual only: workflow_dispatch (available once this file is on main) or a push to a
# branch named bench/** (which reads benchmarks/offline/ci_models.txt). It never runs on
# pull requests or on pushes to any other branch, and it needs no credentials. Each model runs alone on its own fresh runner, so results are not distorted
# by other work on the machine (the maintainer's 8 GB laptop is not usable for this).
# Weights are downloaded from Hugging Face at the revision and sha256 pinned in
# benchmarks/offline/models.json and are discarded with the runner. Only the result
# JSON for dataset A (original, synthetic tasks) is uploaded.
name: offline-benchmark

on:
  push:
    branches: ["bench/**"]
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated ids from benchmarks/offline/models.json, or 'all'"
        default: "qwen3.5-0.8b-q4km"
        required: true
      threads:
        description: "CPU threads for inference"
        default: "4"
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: matrix
        shell: bash
        env:
          MODELS: ${{ inputs.models }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          registry = json.load(open("benchmarks/offline/models.json"))["models"]
          ids = [m["id"] for m in registry]
          asked = os.environ["MODELS"].strip()
          if not asked:  # push to bench/**: the list lives in the repository
              lines = open("benchmarks/offline/ci_models.txt").read().splitlines()
              asked = ",".join(x.strip() for x in lines if x.strip() and not x.startswith("#"))
          chosen = ids if asked == "all" else [x.strip() for x in asked.split(",") if x.strip()]
          unknown = sorted(set(chosen) - set(ids))
          if unknown:
              raise SystemExit(f"unknown model ids: {unknown}")
          runtime = {m["id"]: m["runtime"] for m in registry}
          print("matrix=" + json.dumps({"include": [{"id": i, "runtime": runtime[i]} for i in chosen]}))
          EOF

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Record the runner
        shell: bash
        run: |
          nproc; free -m | sed -n 2p; lscpu | grep -E "Model name|^CPU\(s\)"; uptime

      - name: Build llama.cpp (pinned commit)
        if: matrix.runtime == 'llama.cpp'
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: ~/ai12/build
          key: llama-cpp-b1b770d9-${{ runner.os }}-${{ runner.arch }}

      - name: Compile llama.cpp
        if: matrix.runtime == 'llama.cpp' && steps.llama-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q cmake ninja-build
          AI12_ROOT=$HOME/ai12 bash benchmarks/offline/desktop/build_llama_cpp.sh

      - name: Run the benchmark (llama.cpp)
        if: matrix.runtime == 'llama.cpp'
        shell: bash
        run: |
          export AI12_ROOT=$HOME/ai12
          bash benchmarks/offline/desktop/run_desktop.sh "${{ matrix.id }}" "${{ inputs.threads || '4' }}"

      - name: Run the benchmark (LiteRT-LM)
        if: matrix.runtime == 'litert-lm'
        shell: bash
        run: |
          python -m pip install --quiet litert-lm-api==0.19.2
          mkdir -p "$HOME/ai12/models" "$HOME/ai12/litert-cache" benchmarks/offline/runs/desktop
          python -I benchmarks/offline/fetch_model.py "${{ matrix.id }}" --dest "$HOME/ai12/models"
          FILE=$(python -I -c "import json,sys; print([m for m in json.load(open(sys.argv[1]))['models'] if m['id']==sys.argv[2]][0]['file'])" benchmarks/offline/models.json "${{ matrix.id }}")
          python benchmarks/offline/litert_bench.py --model-id "${{ matrix.id }}" \
            --model "$HOME/ai12/models/$FILE" --threads "${{ inputs.threads || '4' }}" --ctx 4096 \
            --sampled-repeats 3 --cache-dir "$HOME/ai12/litert-cache" \
            --out "benchmarks/offline/runs/desktop/${{ matrix.id }}.json"

      - name: Upload the result (no weights, dataset A only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.id }}
          path: |
            benchmarks/offline/runs/desktop/${{ matrix.id }}.json
            benchmarks/offline/runs/desktop/${{ matrix.id }}.failed.txt
          if-no-files-found: warn
          retention-days: 30
